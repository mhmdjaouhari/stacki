name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # The same command as the pre-push hook: formatting, oxlint (type-aware),
  # TypeScript 7 and the Studio build (tools/check.mts).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
